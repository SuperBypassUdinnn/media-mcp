name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite drives the real tools the design depends on, so the runner installs
# them instead of mocking them. fc-match needs a monospace font for tile labels,
# and the ingest tests invoke `yt-dlp` by name. The transcription pipeline
# (torch, faster-whisper, pyannote: tens of gigabytes) is deliberately NOT built
# here: the regression that drives it skips when transcribe/.venv is absent,
# which is also the state of a fresh checkout.
#
# Static checks run before the system packages, so a lint failure reports in
# about a minute instead of queueing behind an apt install.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Build the server virtualenv from the pinned manifest
        run: |
          uv venv media/.venv --python 3.14
          uv pip install --python media/.venv/bin/python -r media/requirements.txt
          # The ingest tests exercise the real downloader by name.
          uv pip install --python media/.venv/bin/python yt-dlp

      - name: Put the virtualenv on PATH
        run: echo "$PWD/media/.venv/bin" >> "$GITHUB_PATH"

      - name: Static checks
        run: |
          media/.venv/bin/python -m ruff check .
          media/.venv/bin/python -m ruff format --check .

      - name: Cache APT package archives
        uses: actions/cache@v4
        with:
          # Holds the .deb files apt-get install downloads. On a cache hit the
          # install skips the network download (apt-get update still runs to
          # refresh indexes, which is fast). Bump v2 when the package list changes.
          path: /var/cache/apt/archives
          key: apt-packages-v2-${{ runner.os }}

      - name: Install the system tools the suite drives
        run: |
          # The suite drives these binaries directly, and the ubuntu-latest image
          # carries none of them, so the list is fixed instead of probed: a
          # tool name is not always a package name, and one wrong entry fails the
          # whole install. ffprobe ships in ffmpeg, tesseract in tesseract-ocr.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind \
            espeak-ng \
            fonts-dejavu-core fontconfig

      - name: System tool versions
        run: |
          ffmpeg -version | head -1
          tesseract --version | head -1
          espeak-ng --version | head -1
          fc-match monospace

      - name: Test suite
        run: media/.venv/bin/python -m pytest -q
