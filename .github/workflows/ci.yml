name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The suite runs the real tools the design depends on, so the runner installs
# them instead of mocking them. The transcription pipeline (torch,
# faster-whisper, pyannote: tens of gigabytes) is deliberately NOT built here:
# the regression that drives it skips when transcribe/.venv is absent, which is
# the same state as a fresh checkout.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install the system tools the tests drive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind \
            espeak-ng \
            fonts-dejavu-core fontconfig

      - name: Build the server virtualenv from the pinned manifest
        run: |
          uv venv media/.venv --python 3.14
          uv pip install --python media/.venv/bin/python -r media/requirements.txt
          # The ingest tests exercise the real downloader by name.
          uv pip install --python media/.venv/bin/python yt-dlp

      - name: Put the virtualenv on PATH
        # The ingest tests invoke `yt-dlp` by name; pinning it in the venv keeps
        # the version under the manifest's control instead of the runner's.
        run: echo "$PWD/media/.venv/bin" >> "$GITHUB_PATH"

      - name: Static checks
        run: |
          media/.venv/bin/python -m ruff check .
          media/.venv/bin/python -m ruff format --check .

      - name: Test suite
        run: media/.venv/bin/python -m pytest -q
